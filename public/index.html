<!DOCTYPE html>
<html lang="id">

<section id="authSection">
    <div style="position: absolute; top: 15px; left: 15px; z-index: 1000;">
        <span id="lock-icon" style="cursor: pointer; font-size: 20px; background: white; padding: 8px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.1);" title="Admin Login">🔐</span>
        
        <div id="loginFormContainer" style="display: none; margin-top: 8px; padding: 15px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); width: 250px;">
            <h3 style="margin-bottom: 10px; font-size: 16px;">Login Admin</h3>

            <form id="loginForm">
                <input type="text" id="authUsername" placeholder="Username" required style="width: 100%; padding: 6px; margin-bottom: 8px; box-sizing: border-box;"/>
                <input type="password" id="authPassword" placeholder="Password" required style="width: 100%; padding: 6px; margin-bottom: 8px; box-sizing: border-box;"/>
                <button type="submit" style="width: 100%; background: #4f46f6; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">Login</button>
            </form>
            
            <button type="button" id="registerBtn" style="width: 100%; background: #64749c; color: white; border: none; padding: 6px; border-radius: 4px; margin-top: 6px; cursor: pointer;">Register</button>
        </div>
    </div>
    <div id="userInfoContainer" style="display: none; justify-content: space-between; align-items: center;">
        <p>Selamat datang, Admin! 👋</p>
        <button id="logoutBtn" style="background: #ef4455; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Logout</button>
    </div>
</section>

<section id="adminProductForm" style="display: none; background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e801; margin-bottom: 24px;">
    <h3>➕ Tambah Produk Baru</h3>
    <form id="addProductForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px;">
        <div class="mb-3">
            <label for="name" class="form-label">Nama Produk</label>
            <input type="text" id="name" class="form-control" required>
        </div>        

        <div class="mb-3">
            <label for="price" class="form-label">Harga</label>
            <input type="number" id="price" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Deskripsi</label>
            <textarea id="description" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Gambar Produk</label>
            <input type="file" id="image" accept="image/*" class="form-control" required>

            <div style="margin-top: 10px;">
                <img id="imagePreview" src="" alt="Preview Gambar" style="display: none; max-width: 150px; max-height: 150px; border-radius: 4px; object-fit: cover;" />
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Tambah Produk</button>
    </form>
</section>

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width", initial-scale="1.0"/>
    <title>Toko Online</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <img src="logopng.png" style="height: 100px; width: 200px;">
        </div>
    </header>

    <main class="main-container">
        
        <section class="products-section">
            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Katalog Produk</h2>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari produk..."
                    style="padding: 8px 20px; border-radius: 6px; border: 1px solid #cbd5f2; width: 220px; outline: none;"
                />
                
            </div>

            <div id="product-list" class="product-grid"></div>

            <div id="pagination-container" style="display: flex; justify-content: center; gap: 10px; margin-top: 30px;"></div>
            
        </section>
    </main>

    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEditModal()">&times;</span>
            <h2>Edit Produk / Foto</h2>

            <form id="editProductForm">
                <input type="hidden" id="editProductId">

                <div class="form-group">
                    <label for="editName">Nama / Judul:</label>
                    <input type="text" id="editName" required>
                </div>

                <div class="form-group">
                    <label for="editPrice">Harga:</label>
                    <input type="number" id="editPrice" required>
                </div>

                <div class="form-group">
                    <label for="editDescription">Deskripsi:</label>
                    <textarea id="editDescription" required></textarea>
                </div>

                <div class="form-group">
                    <label for="editImage">Ganti Foto (Opsional):</label>
                    <input type="file" id="editImage" accept="image/*">

                    <div style="margin-top: 10px;">
                        <img id="editImagePreview" src="" alt="Preview Gambar" style="display: none; max-width: 150px; max-height: 150px; border-radius: 4px; object-fit: cover;" />
                    </div>
                </div>

                <button type="submit" class="btn-submit">Simpan Perubahan</button>
                <button type="button" onclick="closeEditModal()" class="btn-cancel">Batal</button>
            </form>
        </div>
    </div>

    <script src="app.js?v=2"></script>

    <div id="imageModal" style="display: none; position: fixed; z-index: 9999; padding-top: 50px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9);">
        <span id="closeModal" style="position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer;">&times;</span>

        <img id="modalImage" style="margin: auto; display: block; max-width: 80%; max-height: 80vh; border-radius: 8px;" />
    </div>
</body>
</html>
